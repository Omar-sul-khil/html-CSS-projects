<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat page</title>
    <link rel="stylesheet" href="style.css">
        
</head>
<body>

    <div class="chat-container">
        
        <div class="message-row message-row--others">
            <div class="avatar">FN</div>
            <div class="bubble">
                Teacher, is the homework due today?
            </div>
        </div>

        <div class="message-row message-row--me">
            <div class="avatar">MD</div>
            <div class="bubble">
                Yes — upload your project link before 4 pm.
            </div>
        </div>

        <div class="message-row message-row--others">
            <div class="avatar">FN</div>
            <div class="bubble">
                Done! It is hosted on Netlify Pages.
            </div>
        </div>
    </div>

</body>
</html>
