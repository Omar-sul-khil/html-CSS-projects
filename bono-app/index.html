<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Bono App</title>

<body>
    <header class="header">
        <h1 class="logo">Bono</h1>
        <div class="info">
                <div class="info">
  <p><i class="fa-solid fa-envelope"></i> <a href="#">contact@gmail.com</a></p>
  <p><i class="fa-solid fa-phone"></i> <a href="#">(93) 799112233</a></p>
</div>

        </div>
    </header>
    <div class="container">
    <main>
    <div class="group-form">
        <label for="name">Name</label>
        <input type="text" id="name">
    </div>
    <div class="group-form">
         <label for="email">Email</label>
        <input type="text" id="email">
    </div>
    <div class="group-form">
        <label for="message">Message</label>
        <textarea id="message"></textarea>
    </div>
    <div class="group-form"><button type="submit" class="btn">submit</button></div>
    </main>
    <section>
        <h1>Coming for every developer</h1>
        <p>Our new Bono web app will change the way you think
            about content management and will allow you to focus
            on what's really important. Use the contact form to send
            us your thoughts</p>
        </section>
    </div>
